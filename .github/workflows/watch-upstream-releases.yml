name: Watch upstream releases

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-upstream.sh releases
        env:
          GH_TOKEN: ${{ github.token }}
